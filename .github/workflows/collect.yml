name: 유증 수집기

# KR-hegemony 와 같은 구조: Actions 가 데이터를 갱신·커밋 → Netlify 가 자동 재배포.
#
# 사전 준비 (한 번만): 레포 Settings → Secrets and variables → Actions
#   DART_API_KEY        (필수) opendart 인증키
#   KRX_API_KEY         (필수) openapi.krx.co.kr 인증키 — '신주인수권증서 일별매매정보',
#                        '유가증권/코스닥 일별매매정보' 서비스 이용신청 승인 필요

on:
  schedule:
    - cron: '40 23 * * 0-4'   # 평일 08:40 KST — 전일 KRX 시세 확정분 수집
    - cron: '40 9 * * 1-5'    # 평일 18:40 KST — 당일 DART 공시 감지
  push:
    # PR 브랜치에 푸시하면 verify 만 실행 (데이터 커밋 없음) — 머지 전 실제 API 점검용
    branches: ['claude/yujeung-*']
  workflow_dispatch:
    inputs:
      command:
        description: 'daily / verify / backfill-cases / backfill-rights / backtest / backtest-compare'
        default: daily
      year:
        description: 'backtest 연도 (2020~2026, 2026은 6월까지). 비우면 합산만'
        default: ''
      months:
        description: 'backfill-cases 개월 수'
        default: '5'
      start:
        description: 'backfill 시작일 YYYYMMDD (backfill-rights 전용)'
        default: ''
      end:
        description: 'backfill 종료일 YYYYMMDD'
        default: ''

permissions:
  contents: write

concurrency:
  # PR 시험 실행(push)은 데이터를 커밋하지 않으므로 별도 줄 — 대기 중인 backtest·daily 를 밀어내지 않게
  group: ${{ github.event_name == 'push' && format('yujeung-trial-{0}', github.ref) || 'yujeung-collect' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # backtest 한 해 = 공시 감지 + 원문 + KRX 수백 회
    env:
      PYTHONUNBUFFERED: '1'
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Test (offline)
        run: python -m pytest -q

      - name: Run
        run: |
          CMD="${{ github.event.inputs.command || 'daily' }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            # PR 브랜치: 실제 API 점검 + 백필 시험 실행(저장 안 함) 결과를 로그로
            python -m yujeung verify || echo "::warning::verify 일부 실패"
            # 실제 원문 점검: 이렘 9/23 기재정정(정정표가 본문 앞), 경남제약 9/18 기재정정(정정표가 본문 뒤·인수권 추후결정)
            python -m yujeung parse-doc 20260923000500 || true
            python -m yujeung parse-doc 20260918000349 || true
            python -m yujeung backfill-cases --months 1 --dry-run --report all   # 진행 중 주주배정 전부 재파싱 결과
            # 백테스트 꼬리 기간 상세 조회 생략: 2020 감지 결과가 생략 전과 같은지 (다르면 실패)
            python -m yujeung backtest --year 2020 --compare-tail
            exit 0
          fi
          case "$CMD" in
            daily)  python -m yujeung daily ;;
            verify) python -m yujeung verify ;;
            backfill-cases) python -m yujeung backfill-cases --months "${{ github.event.inputs.months || 5 }}" --report 210980 290650 009730 ;;
            backfill-rights) python -m yujeung backfill-rights --start "${{ github.event.inputs.start }}" --end "${{ github.event.inputs.end }}" ;;
            backtest)
              if [ -n "${{ github.event.inputs.year }}" ]; then python -m yujeung backtest --year "${{ github.event.inputs.year }}"
              else python -m yujeung backtest --aggregate-only; fi ;;
            backtest-compare) python -m yujeung backtest --year "${{ github.event.inputs.year }}" --compare-tail ;;
            *) echo "unknown command $CMD"; exit 1 ;;
          esac

      - name: Commit data if changed
        if: always() && github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/site.json data/yujeung.sql
          [ -e data/backtest.json ] && git add data/backtest.json data/backtest
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 유증 데이터 자동 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d\ %H:%M) KST)"
            # 긴 백테스트 도중 main 이 앞서 나갔으면 받아서 올린다 (데이터 파일은 봇만 쓴다)
            git pull --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
            git push
          fi
