name: 유증 수집기

# KR-hegemony 와 같은 구조: Actions 가 데이터를 갱신·커밋 → Netlify 가 자동 재배포.
#
# 사전 준비 (한 번만): 레포 Settings → Secrets and variables → Actions
#   DART_API_KEY        (필수) opendart 인증키
#   KRX_API_KEY         (필수) openapi.krx.co.kr 인증키 — '신주인수권증서 일별매매정보',
#                        '유가증권/코스닥 일별매매정보' 서비스 이용신청 승인 필요
#   TELEGRAM_BOT_TOKEN  (선택) 없으면 알림은 site.json 알림 로그에만 남음
#   TELEGRAM_CHAT_ID    (선택)

on:
  schedule:
    - cron: '40 23 * * 0-4'   # 평일 08:40 KST — 전일 KRX 시세 확정분 수집
    - cron: '40 9 * * 1-5'    # 평일 18:40 KST — 당일 DART 공시 감지
  workflow_dispatch:
    inputs:
      command:
        description: 'daily / verify / backfill-rights'
        default: daily
      start:
        description: 'backfill 시작일 YYYYMMDD (backfill-rights 전용)'
        default: ''
      end:
        description: 'backfill 종료일 YYYYMMDD'
        default: ''

permissions:
  contents: write

concurrency:
  group: yujeung-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Test (offline)
        run: python -m pytest -q

      - name: Run
        run: |
          CMD="${{ github.event.inputs.command || 'daily' }}"
          case "$CMD" in
            daily)  python -m yujeung daily ;;
            verify) python -m yujeung verify ;;
            backfill-rights) python -m yujeung backfill-rights --start "${{ github.event.inputs.start }}" --end "${{ github.event.inputs.end }}" ;;
            *) echo "unknown command $CMD"; exit 1 ;;
          esac

      - name: Commit data if changed
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/site.json data/yujeung.sql
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 유증 데이터 자동 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d\ %H:%M) KST)"
            git push
          fi
